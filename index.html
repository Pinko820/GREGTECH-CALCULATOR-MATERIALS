<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de Crafteos</title>
<script src="https://cdn.tailwindcss.com/3.4.5"></script>
<script src="https://unpkg.com/lucide@0.379.0/dist/umd/lucide.min.js"></script>
<style>
  body{background:#f1f5f9}
  .inp{width:100%;border:1px solid #cbd5e1;border-radius:.5rem;padding:.4rem .6rem;font-size:.875rem;background:#fff}
  .inp:focus{outline:2px solid #6366f1;outline-offset:-1px;border-color:transparent}
  .btn{display:inline-flex;align-items:center;gap:.35rem;border-radius:.5rem;padding:.45rem .8rem;font-size:.875rem;font-weight:500;transition:.15s}
  .btn svg,.ico svg{width:16px;height:16px}
  .card{background:#fff;border-radius:1rem;border:1px solid #e2e8f0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .tab-on{background:#fff;color:#4338ca;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .tree ul{margin-left:1rem;border-left:2px dashed #e2e8f0;padding-left:.75rem}
  .chip{display:inline-flex;align-items:center;gap:.25rem;border-radius:9999px;padding:.2rem .65rem;font-size:.75rem;font-weight:500;border:1px solid #e2e8f0;background:#fff;color:#475569;transition:.15s}
  .chip:hover{background:#f8fafc}
  .chip-on{background:#4338ca;border-color:#4338ca;color:#fff}
  .chip-on:hover{background:#3730a3}
</style>
</head>
<body class="text-slate-800 min-h-screen">
<datalist id="cat-list"></datalist>
<header class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white">
  <div class="max-w-7xl mx-auto px-4 py-5 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="bg-white/20 p-2 rounded-xl"><i data-lucide="hammer"></i></div>
      <div><h1 class="text-xl font-bold">Calculadora de Crafteos</h1><p class="text-indigo-100 text-sm">Recetas, fluidos (mB), máquinas y cadenas de producción</p></div>
    </div>
    <nav class="flex bg-white/15 p-1 rounded-xl text-sm font-medium">
      <button id="tab-db" onclick="showTab('db')" class="btn text-white"><i data-lucide="database"></i>Base de Datos</button>
      <button id="tab-calc" onclick="showTab('calc')" class="btn text-white"><i data-lucide="calculator"></i>Calculadora</button>
    </nav>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6">
  <!-- BASE DE DATOS -->
  <section id="view-db" class="grid lg:grid-cols-12 gap-6">
    <div class="lg:col-span-4 space-y-6">
      <div class="card p-4">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-semibold flex items-center gap-2"><i data-lucide="package" class="ico"></i>Objetos</h2>
          <button onclick="addItem()" class="btn bg-indigo-600 text-white hover:bg-indigo-700"><i data-lucide="plus"></i>Nuevo</button>
        </div>
        <div class="relative mb-3"><input id="search" oninput="renderItemList()" class="inp pl-8" placeholder="Buscar objeto..."><span class="ico absolute left-2.5 top-2 text-slate-400"><i data-lucide="search"></i></span></div>
        <div id="filters" class="mb-3 space-y-2"></div>
        <ul id="item-list" class="space-y-1 max-h-[420px] overflow-auto"></ul>
      </div>
      <div class="card p-4">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-semibold flex items-center gap-2"><i data-lucide="factory" class="ico"></i>Máquinas</h2>
          <button onclick="addMachine()" class="btn bg-slate-800 text-white hover:bg-slate-900"><i data-lucide="plus"></i>Nueva</button>
        </div>
        <div id="machine-list" class="space-y-2"></div>
      </div>
      <div class="card p-4 flex flex-wrap gap-2">
        <button onclick="exportDb()" class="btn bg-slate-100 hover:bg-slate-200"><i data-lucide="download"></i>Exportar</button>
        <label class="btn bg-slate-100 hover:bg-slate-200 cursor-pointer"><i data-lucide="upload"></i>Importar<input type="file" accept=".json" class="hidden" onchange="importDb(this)"></label>
        <button onclick="resetDb()" class="btn bg-rose-50 text-rose-700 hover:bg-rose-100"><i data-lucide="rotate-ccw"></i>Ejemplo</button>
      </div>
    </div>
    <div class="lg:col-span-8"><div id="editor" class="card p-5"></div></div>
  </section>

  <!-- CALCULADORA -->
  <section id="view-calc" class="hidden space-y-6">
    <div class="card p-5">
      <div class="grid md:grid-cols-12 gap-4 items-end">
        <div class="md:col-span-4"><label class="text-xs font-medium text-slate-500">Objeto deseado</label><select id="c-item" class="inp" onchange="calc()"></select></div>
        <div class="md:col-span-3"><label class="text-xs font-medium text-slate-500">Modo</label>
          <div class="flex bg-slate-100 rounded-lg p-1 text-sm">
            <button id="m-rate" onclick="setMode('rate')" class="flex-1 rounded-md py-1">Por tiempo</button>
            <button id="m-total" onclick="setMode('total')" class="flex-1 rounded-md py-1">Total</button>
          </div></div>
        <div class="md:col-span-2"><label id="c-qty-l" class="text-xs font-medium text-slate-500">Cantidad</label><input id="c-qty" type="number" min="0" step="any" value="1" class="inp" oninput="calc()"></div>
        <div class="md:col-span-3" id="rate-box"><label class="text-xs font-medium text-slate-500">Unidad de tiempo</label>
          <select id="c-per" class="inp" onchange="calc()"><option value="1">por segundo</option><option value="60" selected>por minuto</option><option value="3600">por hora</option></select></div>
        <div class="md:col-span-3 hidden" id="total-box"><label class="text-xs font-medium text-slate-500">En un plazo de</label>
          <div class="flex gap-2"><input id="c-T" type="number" min="0" step="any" value="10" class="inp" oninput="calc()">
          <select id="c-Tu" class="inp w-28" onchange="calc()"><option value="1">seg</option><option value="60" selected>min</option><option value="3600">h</option></select></div></div>
      </div>
    </div>
    <div id="results"></div>
  </section>
</main>

<script>
/* =====================================================================
   Utilidades
   ===================================================================== */
const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 2) => (+n || 0).toLocaleString('es', {maximumFractionDigits: d});
const KEY = 'crafteos-db-v2', OLD_KEY = 'crafteos-db-v1';
const PRESET_CATS = ['Raw Materials', 'Fluids', 'Components', 'Machines'];

/* =====================================================================
   Tipos, unidades y formato de cantidades
   - "item"  -> unidades (u)
   - "fluid" -> milibuckets (mB)
   Todas las cantidades de una receta (out / qty) están expresadas en la
   unidad PROPIA del objeto: 1 Redstone Dust -> 144 mB de Molten Redstone;
   el Pistón pide 72 mB => 72/144 = 0.5 Redstone Dust por pistón.
   ===================================================================== */
const isFluid = it => it?.type === 'fluid';
const unitOf = it => isFluid(it) ? 'mB' : 'u';
function fmtQ(it, n, sfx = '') {
  let s = `${fmt(n, Math.abs(n) < 1 ? 4 : 2)} ${unitOf(it)}${sfx}`;
  if (isFluid(it) && Math.abs(n) >= 1000) s += ` · ${fmt(n / 1000)} B${sfx}`;
  return s;
}

/* =====================================================================
   Datos
   ===================================================================== */
function sample() {
  const m = {furn: 'm1', ass: 'm2', wire: 'm3', ext: 'm4'};
  return {
    machines: [
      {id: m.furn, name: 'Horno eléctrico', power: 4, unit: 'EU/t'},
      {id: m.ass, name: 'Ensambladora', power: 75, unit: 'kW'},
      {id: m.wire, name: 'Trefiladora', power: 8, unit: 'EU/t'},
      {id: m.ext, name: 'Fluid Extractor LV', power: 30, unit: 'EU/t'}],
    items: [
      {id: 'iron_ore', name: 'Mineral de hierro', recipes: []},
      {id: 'copper_ore', name: 'Mineral de cobre', recipes: []},
      {id: 'coal', name: 'Carbón', recipes: []},
      {id: 'redstone', name: 'Redstone Dust', recipes: []},
      {id: 'molten_redstone', name: 'Molten Redstone', type: 'fluid', recipes: [
        {id: uid(), out: 144, time: 1.2, tu: 's', machine: m.ext, inputs: [{item: 'redstone', qty: 1}]}]},
      {id: 'iron', name: 'Placa de hierro', recipes: [
        {id: uid(), out: 1, time: 64, tu: 't', machine: m.furn, inputs: [{item: 'iron_ore', qty: 1}]},
        {id: uid(), out: 2, time: 5, tu: 's', machine: m.ass, inputs: [{item: 'iron_ore', qty: 2}, {item: 'coal', qty: 1}]}]},
      {id: 'copper', name: 'Placa de cobre', recipes: [{id: uid(), out: 1, time: 3.2, tu: 's', machine: m.furn, inputs: [{item: 'copper_ore', qty: 1}]}]},
      {id: 'cable', name: 'Cable de cobre', recipes: [{id: uid(), out: 2, time: 10, tu: 't', machine: m.wire, inputs: [{item: 'copper', qty: 1}]}]},
      {id: 'circuit', name: 'Circuito electrónico', recipes: [{id: uid(), out: 1, time: 0.5, tu: 's', machine: m.ass, inputs: [{item: 'iron', qty: 1}, {item: 'cable', qty: 3}]}]},
      {id: 'piston', name: 'Pistón', recipes: [{id: uid(), out: 1, time: 10, tu: 's', machine: m.ass, inputs: [{item: 'molten_redstone', qty: 72}, {item: 'iron', qty: 2}]}]}]
  };
}

/* Completa campos nuevos (type, category, icon) en bases de datos antiguas. */
function normalize(d) {
  d.machines = (d.machines || []).map(m => ({...m, category: m.category ?? 'Machines', icon: m.icon ?? '', unit: m.unit || 'EU/t', power: +m.power || 0}));
  d.items = (d.items || []).map(i => {
    const it = {...i, type: i.type === 'fluid' ? 'fluid' : 'item', icon: i.icon ?? '', recipes: (i.recipes || []).map(r => ({...r, inputs: r.inputs || []}))};
    if (it.category == null) it.category = it.type === 'fluid' ? 'Fluids' : (it.recipes.length ? 'Components' : 'Raw Materials');
    return it;
  });
  return d;
}

let db;
try { db = normalize(JSON.parse(localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY)) || sample()); } catch { db = normalize(sample()); }
let sel = db.items.find(i => i.recipes.length)?.id || db.items[0]?.id;
let fType = 'all', fCat = 'all';
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} };
const item = id => db.items.find(i => i.id === id);
const mach = id => db.machines.find(m => m.id === id);
const icons = () => lucide.createIcons();
const secs = r => r.tu === 't' ? r.time / 20 : +r.time;
const allCats = () => {
  const s = new Set(PRESET_CATS);
  db.items.forEach(i => i.category && s.add(i.category));
  db.machines.forEach(m => m.category && s.add(m.category));
  return [...s];
};

/* =====================================================================
   Componentes visuales: íconos y badges
   ===================================================================== */
const badge = (cls, html) => `<span class="inline-flex items-center gap-1 text-[11px] font-medium rounded-full px-2 py-0.5 ring-1 ring-inset whitespace-nowrap ${cls}">${html}</span>`;
const typeBadge = it => isFluid(it)
  ? badge('bg-cyan-50 text-cyan-700 ring-cyan-200', '💧 Fluido · mB')
  : badge('bg-orange-50 text-orange-700 ring-orange-200', '⚙️ Item · u');
const energyBadge = (m, draw) => m ? badge('bg-yellow-50 text-yellow-800 ring-yellow-300', `⚡ ${fmt(draw ?? m.power)} ${esc(m.unit)}`) : '';
const machBadge = m => m ? badge('bg-indigo-50 text-indigo-700 ring-indigo-200', `🏗️ ${esc(m.name)}`) : badge('bg-slate-100 text-slate-600 ring-slate-200', '✋ Manual');
const catBadge = c => c ? badge('bg-slate-100 text-slate-600 ring-slate-200', esc(c)) : '';

// Ícono personalizado (URL/ruta) con respaldo automático a un ícono Lucide si falla o no existe.
function iconBox(o, tile, lname, sz = 'w-9 h-9') {
  const img = o?.icon ? `<img src="${esc(o.icon)}" alt="" loading="lazy" onerror="this.remove()" class="absolute inset-0 w-full h-full object-contain p-0.5 bg-white rounded-lg ring-1 ring-slate-200">` : '';
  return `<span class="relative inline-flex shrink-0 items-center justify-center rounded-lg ${sz} ${tile} ico"><i data-lucide="${lname}"></i>${img}</span>`;
}
const itemIcon = (it, sz) => isFluid(it)
  ? iconBox(it, 'bg-cyan-100 text-cyan-600', 'droplet', sz)
  : iconBox(it, 'bg-orange-100 text-orange-600', it?.recipes?.length ? 'box' : 'gem', sz);
const machIcon = (m, sz) => iconBox(m, 'bg-indigo-100 text-indigo-600', 'factory', sz);

/* =====================================================================
   Pestañas
   ===================================================================== */
function showTab(t) {
  ['db', 'calc'].forEach(x => { $('view-' + x).classList.toggle('hidden', x !== t); $('tab-' + x).classList.toggle('tab-on', x === t); $('tab-' + x).classList.toggle('text-white', x !== t); });
  if (t === 'calc') { fillCalcSelect(); calc(); } else renderDb();
}

/* =====================================================================
   Base de datos (UI)
   ===================================================================== */
function renderDb() {
  $('cat-list').innerHTML = allCats().map(c => `<option value="${esc(c)}">`).join('');
  renderItemList(); renderMachines(); renderEditor();
}

function renderFilters() {
  const typeBtn = (v, label) => `<button onclick="fType='${v}';renderItemList()" class="chip ${fType === v ? 'chip-on' : ''}">${label}</button>`;
  const count = c => db.items.filter(i => (i.category || '') === c).length;
  const catBtn = (v, label, n) => `<button data-cat="${esc(v)}" class="chip ${fCat === v ? 'chip-on' : ''}">${esc(label)}${n != null ? ` <span class="opacity-60">${n}</span>` : ''}</button>`;
  const cats = allCats().filter(c => count(c) || PRESET_CATS.includes(c));
  $('filters').innerHTML = `
    <div class="flex flex-wrap gap-1.5">${typeBtn('all', 'Todos')}${typeBtn('item', '⚙️ Item')}${typeBtn('fluid', '💧 Fluido')}</div>
    <div class="flex flex-wrap gap-1.5">${catBtn('all', 'Todas las categorías')}${cats.map(c => catBtn(c, c, count(c))).join('')}${count('') ? catBtn('', 'Sin categoría', count('')) : ''}</div>`;
  $('filters').querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { fCat = b.dataset.cat; renderItemList(); });
}

function renderItemList() {
  renderFilters();
  const q = $('search').value.toLowerCase();
  const list = db.items.filter(i =>
    (fType === 'all' || i.type === fType) &&
    (fCat === 'all' || (i.category || '') === fCat) &&
    i.name.toLowerCase().includes(q)
  ).sort((a, b) => a.name.localeCompare(b.name));

  const groups = {};
  list.forEach(i => (groups[i.category || ''] ||= []).push(i));
  const order = [...allCats(), ''].filter(c => groups[c]);

  $('item-list').innerHTML = order.map(c => `
    <li class="pt-2 first:pt-0"><p class="text-[11px] uppercase tracking-wide text-slate-400 font-semibold px-1 mb-1">${esc(c || 'Sin categoría')}</p></li>
    ${groups[c].map(i => `
    <li><button onclick="sel='${i.id}';renderDb()" class="w-full text-left px-2.5 py-1.5 rounded-lg flex items-center justify-between gap-2 ${i.id === sel ? 'bg-indigo-50 text-indigo-700 font-medium' : 'hover:bg-slate-50'}">
      <span class="flex items-center gap-2 truncate">${itemIcon(i, 'w-7 h-7')}<span class="truncate">${esc(i.name)}</span></span>
      <span class="flex items-center gap-1 shrink-0">${typeBadge(i)}${i.recipes.length ? '' : badge('bg-amber-50 text-amber-700 ring-amber-200', 'básico')}</span>
    </button></li>`).join('')}`).join('') || '<li class="text-sm text-slate-400 px-2">Sin resultados</li>';
  icons();
}

function renderMachines() {
  $('machine-list').innerHTML = db.machines.map(m => `
    <div class="rounded-xl border border-slate-200 p-2 space-y-2">
      <div class="flex gap-2 items-center">
        ${machIcon(m, 'w-9 h-9')}
        <input class="inp" value="${esc(m.name)}" onchange="setM('${m.id}','name',this.value)">
        <input class="inp w-20" type="number" min="0" step="any" value="${m.power}" onchange="setM('${m.id}','power',+this.value)">
        <select class="inp w-24" onchange="setM('${m.id}','unit',this.value)">${['EU/t', 'kW'].map(u => `<option ${u === m.unit ? 'selected' : ''}>${u}</option>`).join('')}</select>
        <button onclick="delMachine('${m.id}')" class="btn p-2 text-slate-400 hover:text-rose-600"><i data-lucide="trash-2"></i></button>
      </div>
      <div class="flex gap-2">
        <input class="inp" list="cat-list" placeholder="Categoría" value="${esc(m.category)}" onchange="setM('${m.id}','category',this.value.trim())">
        <input class="inp" placeholder="Ícono (URL o ruta)" value="${esc(m.icon)}" onchange="setM('${m.id}','icon',this.value.trim())">
      </div>
      <div class="flex flex-wrap gap-1">${badge('bg-indigo-50 text-indigo-700 ring-indigo-200', '🏗️ Máquina')}${energyBadge(m)}${catBadge(m.category)}</div>
    </div>`).join('') || '<p class="text-sm text-slate-400">Sin máquinas</p>';
  icons();
}

function renderEditor() {
  const it = item(sel);
  if (!it) { $('editor').innerHTML = '<p class="text-slate-400 text-center py-16">Selecciona o crea un objeto</p>'; return; }
  const u = unitOf(it);
  const itemOpts = cur => '<option value="">— elegir —</option>' + db.items.filter(o => o.id !== it.id).sort((a, b) => a.name.localeCompare(b.name)).map(o => `<option value="${o.id}" ${o.id === cur ? 'selected' : ''}>${isFluid(o) ? '💧 ' : ''}${esc(o.name)}${isFluid(o) ? ' (mB)' : ''}</option>`).join('');
  const machOpts = cur => '<option value="">Manual (sin máquina)</option>' + db.machines.map(m => `<option value="${m.id}" ${m.id === cur ? 'selected' : ''}>${esc(m.name)} · ${m.power} ${m.unit}</option>`).join('');
  $('editor').innerHTML = `
    <div class="flex flex-wrap items-center gap-3 mb-4">
      ${itemIcon(it, 'w-11 h-11')}
      <input class="inp text-lg font-semibold flex-1 min-w-[180px]" value="${esc(it.name)}" onchange="item(sel).name=this.value.trim()||'Sin nombre';save();renderDb()">
      <button onclick="delItem()" class="btn bg-rose-50 text-rose-700 hover:bg-rose-100"><i data-lucide="trash-2"></i>Eliminar</button>
    </div>
    <div class="grid sm:grid-cols-12 gap-3 mb-5">
      <div class="sm:col-span-3"><label class="text-xs text-slate-500">Tipo</label>
        <select class="inp" onchange="item(sel).type=this.value;save();renderDb()">
          <option value="item" ${!isFluid(it) ? 'selected' : ''}>⚙️ Item (unidades)</option>
          <option value="fluid" ${isFluid(it) ? 'selected' : ''}>💧 Fluido (mB)</option></select></div>
      <div class="sm:col-span-4"><label class="text-xs text-slate-500">Categoría</label>
        <input class="inp" list="cat-list" value="${esc(it.category)}" placeholder="Ej. Components" onchange="item(sel).category=this.value.trim();save();renderDb()"></div>
      <div class="sm:col-span-5"><label class="text-xs text-slate-500">Ícono (URL o ruta de asset)</label>
        <input class="inp" value="${esc(it.icon)}" placeholder="https://… o assets/hierro.png" onchange="item(sel).icon=this.value.trim();save();renderDb()"></div>
    </div>
    <div class="flex flex-wrap gap-1.5 mb-4">${typeBadge(it)}${catBadge(it.category)}</div>
    ${it.recipes.length ? '' : '<div class="mb-4 text-sm bg-amber-50 text-amber-800 rounded-lg p-3 flex gap-2 ico"><i data-lucide="gem"></i><span>Sin recetas: se trata como <b>materia prima básica</b>.</span></div>'}
    ${isFluid(it) ? '<div class="mb-4 text-sm bg-cyan-50 text-cyan-800 rounded-lg p-3">💧 Las cantidades de este objeto se expresan en <b>mB</b> (1 B = 1000 mB). En sus recetas, <i>Produce</i> es en mB; como ingrediente de otras recetas, la cantidad también es en mB.</div>' : ''}
    <div class="space-y-4">${it.recipes.map((r, ri) => `
      <div class="border border-slate-200 rounded-xl p-4 bg-slate-50/50">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-semibold text-sm flex items-center gap-2 ico"><i data-lucide="scroll-text"></i>Receta ${ri + 1}${ri === 0 ? ' <span class="text-xs font-normal text-slate-500">(predeterminada)</span>' : ''}</h3>
          <button onclick="item(sel).recipes.splice(${ri},1);save();renderDb()" class="btn p-1.5 text-slate-400 hover:text-rose-600"><i data-lucide="x"></i></button>
        </div>
        <div class="grid sm:grid-cols-12 gap-3 mb-3">
          <div class="sm:col-span-2"><label class="text-xs text-slate-500">Produce (${u})</label><input class="inp" type="number" min="0.0001" step="any" value="${r.out}" onchange="setR(${ri},'out',+this.value||1)"></div>
          <div class="sm:col-span-4"><label class="text-xs text-slate-500 flex items-center gap-1 ico"><i data-lucide="timer"></i>Tiempo</label>
            <div class="flex gap-2"><input class="inp" type="number" min="0" step="any" value="${r.time}" onchange="setR(${ri},'time',+this.value)">
            <select class="inp w-24" onchange="setR(${ri},'tu',this.value)"><option value="s" ${r.tu === 's' ? 'selected' : ''}>seg</option><option value="t" ${r.tu === 't' ? 'selected' : ''}>ticks</option></select></div></div>
          <div class="sm:col-span-6"><label class="text-xs text-slate-500 flex items-center gap-1 ico"><i data-lucide="factory"></i>Máquina</label><select class="inp" onchange="setR(${ri},'machine',this.value)">${machOpts(r.machine)}</select></div>
        </div>
        <label class="text-xs text-slate-500">Ingredientes (cantidad en la unidad de cada ingrediente)</label>
        <div class="space-y-2 mt-1">${r.inputs.map((inp, ii) => {
          const ing = item(inp.item);
          return `<div class="flex gap-2 items-center"><input class="inp w-24" type="number" min="0" step="any" value="${inp.qty}" onchange="setIn(${ri},${ii},'qty',+this.value)">
          <span class="w-9 text-center text-xs font-semibold rounded-md py-1 ${isFluid(ing) ? 'bg-cyan-100 text-cyan-700' : 'bg-orange-100 text-orange-700'}">${ing ? unitOf(ing) : '·'}</span>
          <select class="inp" onchange="setIn(${ri},${ii},'item',this.value)">${itemOpts(inp.item)}</select>
          <button onclick="item(sel).recipes[${ri}].inputs.splice(${ii},1);save();renderEditor()" class="btn p-2 text-slate-400 hover:text-rose-600"><i data-lucide="minus-circle"></i></button></div>`; }).join('')}
        </div>
        <button onclick="item(sel).recipes[${ri}].inputs.push({item:'',qty:1});save();renderEditor()" class="btn mt-2 text-indigo-600 hover:bg-indigo-50"><i data-lucide="plus"></i>Ingrediente</button>
      </div>`).join('')}
    </div>
    <button onclick="addRecipe()" class="btn mt-4 w-full justify-center border-2 border-dashed border-indigo-200 text-indigo-600 hover:bg-indigo-50 py-3"><i data-lucide="plus-circle"></i>Añadir receta alternativa</button>`;
  icons();
}

function setR(ri, k, v) { item(sel).recipes[ri][k] = v; save(); }
function setIn(ri, ii, k, v) { item(sel).recipes[ri].inputs[ii][k] = v; save(); if (k === 'item') renderEditor(); }
function setM(id, k, v) { mach(id)[k] = v; save(); renderMachines(); renderEditor(); }
function addItem() { const it = {id: uid(), name: 'Nuevo objeto', type: 'item', category: '', icon: '', recipes: []}; db.items.push(it); sel = it.id; save(); renderDb(); }
function addRecipe() { item(sel).recipes.push({id: uid(), out: 1, time: 1, tu: 's', machine: db.machines[0]?.id || '', inputs: [{item: '', qty: 1}]}); save(); renderDb(); }
function addMachine() { db.machines.push({id: uid(), name: 'Nueva máquina', power: 1, unit: 'EU/t', category: 'Machines', icon: ''}); save(); renderMachines(); }
function delMachine(id) {
  if (!confirm('¿Eliminar máquina?')) return;
  db.machines = db.machines.filter(m => m.id !== id);
  db.items.forEach(i => i.recipes.forEach(r => { if (r.machine === id) r.machine = ''; }));
  save(); renderDb();
}
function delItem() {
  if (!confirm('¿Eliminar este objeto? Se quitará de las recetas que lo usan.')) return;
  db.items = db.items.filter(i => i.id !== sel);
  db.items.forEach(i => i.recipes.forEach(r => r.inputs = r.inputs.filter(x => x.item !== sel)));
  sel = db.items[0]?.id; save(); renderDb();
}
function exportDb() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], {type: 'application/json'}));
  a.download = 'crafteos.json'; a.click();
}
function importDb(el) {
  const f = el.files[0]; if (!f) return;
  f.text().then(t => { try { const d = JSON.parse(t); if (!d.items || !d.machines) throw 0; db = normalize(d); sel = db.items[0]?.id; fType = 'all'; fCat = 'all'; save(); renderDb(); } catch { alert('Archivo no válido'); } });
  el.value = '';
}
function resetDb() { if (confirm('¿Reemplazar la base de datos por el ejemplo?')) { db = normalize(sample()); sel = 'piston'; fType = 'all'; fCat = 'all'; save(); renderDb(); } }

/* =====================================================================
   Calculadora
   ===================================================================== */
let mode = 'rate';
const choice = {};          // itemId -> índice de receta elegida
const forceRaw = new Set(); // objetos tratados como básicos

function setMode(m) {
  mode = m;
  $('m-rate').classList.toggle('tab-on', m === 'rate'); $('m-total').classList.toggle('tab-on', m === 'total');
  $('rate-box').classList.toggle('hidden', m !== 'rate'); $('total-box').classList.toggle('hidden', m !== 'total');
  calc();
}

function fillCalcSelect() {
  const cur = $('c-item').value || sel;
  const craftable = db.items.filter(i => i.recipes.length).sort((a, b) => a.name.localeCompare(b.name));
  const groups = {};
  craftable.forEach(i => (groups[i.category || ''] ||= []).push(i));
  const opt = i => `<option value="${i.id}" ${i.id === cur ? 'selected' : ''}>${isFluid(i) ? '💧 ' : ''}${esc(i.name)} (${unitOf(i)})</option>`;
  $('c-item').innerHTML = Object.keys(groups).sort().map(c => `<optgroup label="${esc(c || 'Sin categoría')}">${groups[c].map(opt).join('')}</optgroup>`).join('') || '<option value="">(no hay objetos con receta)</option>';
}

function calc() {
  const target = $('c-item').value, qty = +$('c-qty').value || 0;
  if (!target || !item(target)) { $('results').innerHTML = '<div class="card p-10 text-center text-slate-400">Crea objetos con recetas en la Base de Datos.</div>'; return; }
  const tIt = item(target);
  $('c-qty-l').textContent = `Cantidad (${unitOf(tIt)})`;

  // Todo se calcula en "unidades propias de cada objeto" por segundo (u/s o mB/s).
  // En modo total, tasa = cantidad / plazo.
  const T = mode === 'total' ? (+$('c-T').value || 0) * +$('c-Tu').value : 0;
  if (mode === 'total' && T <= 0) { $('results').innerHTML = '<div class="card p-6 text-rose-600">Indica un plazo mayor que 0.</div>'; return; }
  const rate = mode === 'total' ? qty / T : qty / +$('c-per').value;
  const raw = {}, steps = {}; let cycle = false;

  // r = tasa requerida del objeto `id` (en su propia unidad / s).
  // Una receta produce `out` unidades propias: crafteos/s = r / out.
  // Cada ingrediente requiere crafteos/s * qty (en la unidad propia del ingrediente).
  function walk(id, r, path) {
    const it = item(id) || {id, name: '(desconocido)', recipes: []};
    if (path.includes(id)) cycle = true;
    if (!it.recipes.length || forceRaw.has(id) || path.includes(id) || !id) {
      raw[id] = (raw[id] || 0) + r;
      return {it, r, raw: true};
    }
    const ri = Math.min(choice[id] || 0, it.recipes.length - 1), rec = it.recipes[ri];
    const s = secs(rec), cps = r / (rec.out || 1), m = cps * s;
    const st = steps[id] ||= {it, rec, s, cps: 0, m: 0, out: 0};
    st.cps += cps; st.m += m; st.out += r;
    const children = rec.inputs.filter(x => x.qty > 0).map(x => walk(x.item, cps * x.qty, [...path, id]));
    return {it, r, rec, s, m, children};
  }
  const tree = walk(target, rate, []);

  // Energía y máquinas
  let eut = 0, kw = 0, machinesTot = 0;
  Object.values(steps).forEach(st => {
    const mc = mach(st.rec.machine); st.mc = mc; st.n = Math.ceil(st.m - 1e-9);
    machinesTot += mc ? st.n : 0;
    if (mc?.unit === 'EU/t') { st.draw = st.m * mc.power; eut += st.draw; }
    else if (mc?.unit === 'kW') { st.draw = st.m * mc.power; kw += st.draw; }
    else st.draw = 0;
    // Duración real del paso con las máquinas redondeadas (modo total)
    st.dur = mode === 'total' ? Math.ceil(st.cps * T / Math.max(st.n, 1) - 1e-9) * st.s : st.s;
  });
  // Ruta crítica: duración del paso + el ingrediente más lento
  const crit = n => n.raw ? 0 : steps[n.it.id].dur + Math.max(0, ...n.children.map(crit));
  const critical = crit(tree);
  const horizon = mode === 'total' ? T : 3600;
  const hz = mode === 'total' ? 'total' : 'por hora';
  const perSfx = mode === 'total' ? '' : {1: '/s', 60: '/min', 3600: '/h'}[$('c-per').value];
  const perMul = mode === 'total' ? T : +$('c-per').value;

  // Materias primas: se separan items (u) y fluidos (mB), no se suman entre sí.
  const rawEntries = Object.entries(raw);
  const rawItemsSum = rawEntries.filter(([id]) => !isFluid(item(id))).reduce((a, [, r]) => a + r, 0);
  const rawFluidSum = rawEntries.filter(([id]) => isFluid(item(id))).reduce((a, [, r]) => a + r, 0);
  const rawSub = [rawItemsSum ? fmt(rawItemsSum * perMul) + ' u' : '', rawFluidSum ? fmt(rawFluidSum * perMul) + ' mB' : ''].filter(Boolean).join(' + ') + (perSfx ? ' ' + perSfx : ' total');

  const stat = (icon, color, label, value, sub) => `
    <div class="card p-4 flex gap-3"><div class="p-2.5 h-fit rounded-xl ${color} ico"><i data-lucide="${icon}"></i></div>
    <div><p class="text-xs text-slate-500">${label}</p><p class="text-lg font-bold leading-tight">${value}</p><p class="text-xs text-slate-500">${sub}</p></div></div>`;
  const energyVal = [eut ? fmt(eut) + ' EU/t' : '', kw ? fmt(kw) + ' kW' : ''].filter(Boolean).join(' + ') || '0';
  const energyTot = [eut ? fmt(eut * 20 * horizon, 0) + ' EU' : '', kw ? fmt(kw * horizon / 3600) + ' kWh' : ''].filter(Boolean).join(' · ') || '—';

  const alts = Object.values(steps).filter(st => st.it.recipes.length > 1);
  const ingText = x => `${fmt(x.qty)} ${unitOf(item(x.item))} ${esc(item(x.item)?.name || '?')}`;

  const treeHtml = n => `<li class="py-1">
    <div class="flex flex-wrap items-center gap-2 text-sm">
      ${itemIcon(n.it, 'w-7 h-7')}
      <b class="${isFluid(n.it) ? 'text-cyan-700' : ''}">${esc(n.it.name)}</b>
      <span class="${isFluid(n.it) ? 'text-cyan-600' : 'text-slate-500'}">${fmtQ(n.it, n.r * perMul, perSfx)}</span>
      ${n.raw ? badge('bg-amber-50 text-amber-700 ring-amber-200', 'básico') : machBadge(mach(n.rec.machine)) + `<span class="text-xs bg-slate-100 rounded px-2 py-0.5">× ${fmt(n.m)}</span>`}
      ${n.raw && item(n.it.id)?.recipes.length ? `<button onclick="forceRaw.delete('${n.it.id}');calc()" class="text-xs text-indigo-600 hover:underline">expandir</button>` : ''}
      ${!n.raw && n.it.id !== target ? `<button onclick="forceRaw.add('${n.it.id}');calc()" class="text-xs text-slate-400 hover:text-indigo-600">tratar como básico</button>` : ''}
    </div>${n.raw ? '' : `<ul>${n.children.map(treeHtml).join('')}</ul>`}</li>`;

  $('results').innerHTML = `
    ${cycle ? '<div class="card p-3 mb-4 text-sm bg-rose-50 text-rose-700 border-rose-200">⚠ Se detectó una receta cíclica; el ciclo se cortó tratando el objeto repetido como materia prima.</div>' : ''}
    <div class="card p-4 mb-4 flex flex-wrap items-center gap-3">
      ${itemIcon(tIt, 'w-11 h-11')}
      <div><p class="text-xs text-slate-500">Objetivo</p>
      <p class="font-bold text-lg leading-tight">${esc(tIt.name)} <span class="${isFluid(tIt) ? 'text-cyan-600' : 'text-orange-600'}">${fmtQ(tIt, qty, mode === 'total' ? '' : ({1: '/s', 60: '/min', 3600: '/h'}[$('c-per').value]))}</span></p></div>
      <div class="flex gap-1.5">${typeBadge(tIt)}${catBadge(tIt.category)}</div>
    </div>
    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
      ${stat('gem', 'bg-amber-100 text-amber-700', 'Materias primas', rawEntries.length + ' tipos', rawSub)}
      ${stat('zap', 'bg-yellow-100 text-yellow-700', 'Consumo de energía', '⚡ ' + energyVal, 'Energía ' + hz + ': ' + energyTot)}
      ${stat('clock', 'bg-sky-100 text-sky-700', mode === 'total' ? 'Tiempo estimado (ruta crítica)' : 'Latencia de la cadena', fmt(critical) + ' s', mode === 'total' ? `≈ ${fmt(critical / 60)} min con las máquinas indicadas` : 'tiempo hasta la primera unidad')}
      ${stat('factory', 'bg-indigo-100 text-indigo-700', 'Máquinas en paralelo', '🏗️ ' + machinesTot, Object.keys(steps).length + ' pasos de producción')}
    </div>
    ${alts.length ? `<div class="card p-4 mt-6"><h3 class="font-semibold mb-3 flex items-center gap-2 ico"><i data-lucide="git-branch"></i>Recetas alternativas</h3>
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">${alts.map(st => `<div><label class="text-xs text-slate-500">${esc(st.it.name)}</label>
        <select class="inp" onchange="choice['${st.it.id}']=+this.value;calc()">${st.it.recipes.map((r, i) => `<option value="${i}" ${i === (choice[st.it.id] || 0) ? 'selected' : ''}>Receta ${i + 1}: ${r.inputs.map(ingText).join(', ')} → ${fmt(r.out)} ${unitOf(st.it)}</option>`).join('')}</select></div>`).join('')}</div></div>` : ''}
    <div class="grid lg:grid-cols-5 gap-6 mt-6">
      <div class="card p-4 lg:col-span-2"><h3 class="font-semibold mb-3 flex items-center gap-2 ico"><i data-lucide="gem"></i>Materia prima básica</h3>
        <table class="w-full text-sm"><thead class="text-slate-500 text-xs"><tr><th class="text-left py-1">Recurso</th><th class="text-right">${mode === 'total' ? 'Total' : 'Cantidad ' + perSfx}</th><th class="text-right">${mode === 'total' ? '/min' : 'por hora'}</th></tr></thead>
        <tbody>${rawEntries.sort((a, b) => b[1] - a[1]).map(([id, r]) => { const it = item(id) || {recipes: []}; return `<tr class="border-t"><td class="py-1.5"><span class="flex items-center gap-2">${itemIcon(it, 'w-7 h-7')}<span>${esc(it.name || '(sin asignar)')}</span></span></td>
          <td class="text-right font-medium ${isFluid(it) ? 'text-cyan-700' : ''}">${fmtQ(it, mode === 'total' ? Math.ceil(r * T - 1e-9) : r * perMul)}</td>
          <td class="text-right text-slate-500">${fmtQ(it, mode === 'total' ? r * 60 : r * 3600)}</td></tr>`; }).join('')}</tbody></table></div>
      <div class="card p-4 lg:col-span-3 overflow-x-auto"><h3 class="font-semibold mb-3 flex items-center gap-2 ico"><i data-lucide="factory"></i>Pasos de producción</h3>
        <table class="w-full text-sm min-w-[620px]"><thead class="text-slate-500 text-xs"><tr><th class="text-left py-1">Objeto</th><th class="text-left">Máquina</th><th class="text-right">Salida/craft</th><th class="text-right">Crafteos/s</th><th class="text-right">Máquinas</th><th class="text-right">Energía</th></tr></thead>
        <tbody>${Object.values(steps).map(st => `<tr class="border-t"><td class="py-1.5"><span class="flex items-center gap-2">${itemIcon(st.it, 'w-7 h-7')}<span>${esc(st.it.name)}</span></span></td>
          <td>${machBadge(st.mc)}</td>
          <td class="text-right ${isFluid(st.it) ? 'text-cyan-700' : ''}">${fmtQ(st.it, st.rec.out)}</td>
          <td class="text-right">${fmt(st.cps, 3)}</td>
          <td class="text-right"><b>${st.n}</b> <span class="text-slate-400 text-xs">(${fmt(st.m)})</span></td>
          <td class="text-right">${st.mc ? energyBadge(st.mc, st.draw) : '—'}</td></tr>`).join('')}</tbody></table></div>
    </div>
    <div class="card p-4 mt-6 tree"><h3 class="font-semibold mb-2 flex items-center gap-2 ico"><i data-lucide="network"></i>Árbol de crafteo</h3><ul style="margin:0;border:0;padding:0">${treeHtml(tree)}</ul></div>`;
  icons();
}

setMode('rate');
showTab('db');
</script>
</body>
</html>
